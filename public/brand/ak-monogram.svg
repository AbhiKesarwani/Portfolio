<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">AK monogram</title>
  <desc id="desc">Stylized AK initials in green on a dark circular field with a subtle gold ring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102117"/>
      <stop offset="1" stop-color="#070f0b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9bff7d"/>
      <stop offset="1" stop-color="#69d84f"/>
    </linearGradient>
    <radialGradient id="halo" cx="30%" cy="24%" r="72%">
      <stop offset="0" stop-color="#6ceba9" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#6ceba9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="64" cy="64" r="52" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="52" fill="url(#halo)"/>
  <circle cx="64" cy="64" r="56" fill="none" stroke="#e9bc4f" stroke-opacity="0.8" stroke-width="2.4"/>
  <circle cx="64" cy="64" r="59.5" fill="none" stroke="#69d84f" stroke-opacity="0.28" stroke-width="1.2"/>

  <text
    x="64"
    y="79"
    text-anchor="middle"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="48"
    font-weight="800"
    letter-spacing="2"
    fill="url(#green)"
  >AK</text>
</svg>
